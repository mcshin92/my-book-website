<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>나의 책</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="page">
    <article>
      <h1>자연에서 와서, 삶으로 답하다</h1>

      <p>
        이곳에 책의 본문을 넣습니다.
      </p>
    </article>

    <section id="guestbook" class="guestbook">
      <p class="guestbook-kicker">Reader guestbook</p>
      <h2>읽고 난 뒤의 한마디</h2>

      <p class="guestbook-intro">
        글을 읽으며 떠오른 생각이나 마음에 남은 문장을
        편안하게 남겨 주세요.
      </p>

      <form id="guestbook-form">
        <div class="form-row">
          <label for="guest-name">이름</label>
          <input
            id="guest-name"
            name="name"
            type="text"
            maxlength="30"
            required
          >
        </div>

        <div class="form-row">
          <label for="guest-message">한마디</label>
          <textarea
            id="guest-message"
            name="message"
            maxlength="500"
            rows="5"
            required
          ></textarea>

          <div class="character-count">
            <span id="message-length">0</span>/500
          </div>
        </div>

        <!-- 사람에게는 보이지 않는 스팸 방지 필드 -->
        <div class="honeypot" aria-hidden="true">
          <label for="guest-website">Website</label>
          <input
            id="guest-website"
            name="website"
            type="text"
            tabindex="-1"
            autocomplete="off"
          >
        </div>

        <button id="submit-button" type="submit">
          방명록 남기기
        </button>

        <p id="form-status" role="status"></p>
      </form>

      <div class="guestbook-list-header">
        <h3>독자들의 이야기</h3>
        <span id="guestbook-count"></span>
      </div>

      <div id="guestbook-loading">
        방명록을 불러오고 있습니다.
      </div>

      <div id="guestbook-list"></div>

      <nav
        id="guestbook-pagination"
        class="pagination"
        aria-label="방명록 페이지 이동"
      >
        <button id="previous-page" type="button">
          이전
        </button>

        <span id="page-indicator">1 / 1</span>

        <button id="next-page" type="button">
          다음
        </button>
      </nav>
    </section>
  </main>

  <script>
    const ITEMS_PER_PAGE = 10;

    let guestbookItems = [];
    let currentPage = 1;

    const form = document.getElementById("guestbook-form");
    const nameInput = document.getElementById("guest-name");
    const messageInput = document.getElementById("guest-message");
    const websiteInput = document.getElementById("guest-website");
    const messageLength = document.getElementById("message-length");
    const submitButton = document.getElementById("submit-button");
    const formStatus = document.getElementById("form-status");

    const loading = document.getElementById("guestbook-loading");
    const list = document.getElementById("guestbook-list");
    const count = document.getElementById("guestbook-count");

    const previousButton =
      document.getElementById("previous-page");

    const nextButton =
      document.getElementById("next-page");

    const pageIndicator =
      document.getElementById("page-indicator");

    messageInput.addEventListener("input", () => {
      messageLength.textContent = messageInput.value.length;
    });

    function formatDate(value) {
      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function renderGuestbook() {
      list.replaceChildren();

      const totalItems = guestbookItems.length;
      const totalPages = Math.max(
        1,
        Math.ceil(totalItems / ITEMS_PER_PAGE)
      );

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      count.textContent = `총 ${totalItems}개의 글`;

      pageIndicator.textContent =
        `${currentPage} / ${totalPages}`;

      previousButton.disabled = currentPage <= 1;
      nextButton.disabled = currentPage >= totalPages;

      if (totalItems === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent =
          "아직 등록된 글이 없습니다. 첫 한마디를 남겨 주세요.";

        list.appendChild(empty);
        return;
      }

      const startIndex =
        (currentPage - 1) * ITEMS_PER_PAGE;

      const pageItems = guestbookItems.slice(
        startIndex,
        startIndex + ITEMS_PER_PAGE
      );

      for (const item of pageItems) {
        const article = document.createElement("article");
        article.className = "guestbook-entry";

        const header = document.createElement("div");
        header.className = "entry-header";

        const name = document.createElement("strong");
        name.textContent = item.name;

        const date = document.createElement("time");
        date.dateTime = item.createdAt;
        date.textContent = formatDate(item.createdAt);

        const message = document.createElement("p");
        message.textContent = item.message;

        header.append(name, date);
        article.append(header, message);
        list.appendChild(article);
      }
    }

    async function loadGuestbook() {
      loading.hidden = false;

      try {
        const response = await fetch("/api/guestbook", {
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          throw new Error("방명록 조회 실패");
        }

        const data = await response.json();

        guestbookItems = Array.isArray(data.items)
          ? data.items
          : [];

        renderGuestbook();
      } catch (error) {
        list.replaceChildren();

        const failure = document.createElement("p");
        failure.className = "error-message";
        failure.textContent =
          "방명록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";

        list.appendChild(failure);
      } finally {
        loading.hidden = true;
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      submitButton.disabled = true;
      formStatus.textContent = "등록하고 있습니다.";

      try {
        const response = await fetch("/api/guestbook", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: nameInput.value,
            message: messageInput.value,
            website: websiteInput.value
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "방명록 등록에 실패했습니다."
          );
        }

        form.reset();
        messageLength.textContent = "0";
        currentPage = 1;

        formStatus.textContent =
          "소중한 글이 등록되었습니다.";

        await loadGuestbook();
      } catch (error) {
        formStatus.textContent =
          error.message ||
          "방명록 등록에 실패했습니다.";
      } finally {
        submitButton.disabled = false;
      }
    });

    previousButton.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        renderGuestbook();
        document
          .getElementById("guestbook")
          .scrollIntoView({ behavior: "smooth" });
      }
    });

    nextButton.addEventListener("click", () => {
      const totalPages = Math.max(
        1,
        Math.ceil(
          guestbookItems.length / ITEMS_PER_PAGE
        )
      );

      if (currentPage < totalPages) {
        currentPage += 1;
        renderGuestbook();
        document
          .getElementById("guestbook")
          .scrollIntoView({ behavior: "smooth" });
      }
    });

    loadGuestbook();
  </script>
</body>
</html>
